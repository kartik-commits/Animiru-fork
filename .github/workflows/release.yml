name: Release

permissions:
  contents: write

on:
  push:
    branches:
      - release
    tags:
      - "v*"

env:
  ANIMIRU_GITHUB_RELEASE: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get_tag:
    name: Extract tag name
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.extract.outputs.tag }}

    steps:
      - name: Get tag name
        id: extract
        run: echo "tag=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: get_tag

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Decode signing keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > "${{ runner.temp }}/quickie.keystore"
          else
            echo "::error::SIGNING_KEY secret is not set!"
            exit 1
          fi

      - name: Build
        run: ./gradlew assembleRelease -Pdist=github
        env:
          storeFile: ${{ runner.temp }}/quickie.keystore
          storePassword: ${{ secrets.KEY_STORE_PASSWORD || 'android' }}
          keyAlias: ${{ secrets.ALIAS || 'androiddebugkey' }}
          keyPassword: ${{ secrets.KEY_PASSWORD || 'android' }}

      - name: Rename APK
        run: |
          set -e

          mv app/build/outputs/apk/release/app-universal-release.apk Animiru-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-arm64-v8a-release.apk Animiru-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-armeabi-v7a-release.apk Animiru-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-x86-release.apk Animiru-x86-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-x86_64-release.apk Animiru-x86_64-${{ needs.get_tag.outputs.tag }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Animiru
          path: |
            Animiru-${{ needs.get_tag.outputs.tag }}.apk
            Animiru-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            Animiru-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
            Animiru-x86-${{ needs.get_tag.outputs.tag }}.apk
            Animiru-x86_64-${{ needs.get_tag.outputs.tag }}.apk

  build_foss:
    name: Build (FOSS)
    runs-on: ubuntu-latest
    needs: get_tag

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Decode signing keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > "${{ runner.temp }}/quickie.keystore"
          else
            echo "::error::SIGNING_KEY secret is not set!"
            exit 1
          fi

      - name: Build
        run: ./gradlew assembleFoss -Pdist=foss
        env:
          storeFile: ${{ runner.temp }}/quickie.keystore
          storePassword: ${{ secrets.KEY_STORE_PASSWORD || 'android' }}
          keyAlias: ${{ secrets.ALIAS || 'androiddebugkey' }}
          keyPassword: ${{ secrets.KEY_PASSWORD || 'android' }}

      - name: Rename APK
        run: |
          set -e

          mv app/build/outputs/apk/foss/app-universal-foss.apk Animiru-${{ needs.get_tag.outputs.tag }}-foss.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Animiru-foss
          path: Animiru-${{ needs.get_tag.outputs.tag }}-foss.apk

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [get_tag, build, build_foss]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate Checksums
        run: |
          sha256sum Animiru*.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get_tag.outputs.tag }}
          name: Animiru Widevine Edition ${{ needs.get_tag.outputs.tag }}
          body: |
            Animiru (Media3 Widevine Edition) release.

            See [Release Notes](https://github.com/kartik-commits/Animiru-fork/releases) for history.

            > [!TIP]
            > If you are unsure which version to download, choose `Animiru-${{ needs.get_tag.outputs.tag }}.apk` (universal) or `Animiru-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk` (most modern Android phones).
          files: |
            Animiru-${{ needs.get_tag.outputs.tag }}.apk
            Animiru-${{ needs.get_tag.outputs.tag }}-foss.apk
            Animiru-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            Animiru-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
            Animiru-x86-${{ needs.get_tag.outputs.tag }}.apk
            Animiru-x86_64-${{ needs.get_tag.outputs.tag }}.apk
            SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
